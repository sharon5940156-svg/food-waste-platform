services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: food_waste_timescaledb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: food_waste_db
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d food_waste_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: food_waste_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@timescaledb:5432/food_waste_db
    depends_on:
      timescaledb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: food_waste_frontend
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app
    environment:
      BACKEND_URL: http://backend:8000
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - backend

volumes:
  timescaledb_data:
