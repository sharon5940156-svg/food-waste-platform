services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: food_waste_timescaledb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: food_waste_db
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d food_waste_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: food_waste_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@timescaledb:5432/food_waste_db
    depends_on:
      timescaledb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: food_waste_frontend
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app
    environment:
      BACKEND_URL: http://backend:8000
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - backend

  mqtt:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: food_waste_mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    container_name: food_waste_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  edge-gateway:
    build:
      context: ./edge_gateway
    container_name: food_waste_edge_gateway
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_TOPIC: food/telemetry/#
      KAFKA_BOOTSTRAP: kafka:19092
      KAFKA_TOPIC: telemetry.raw
    depends_on:
      mqtt:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped

  telemetry-consumer:
    build:
      context: ./telemetry_consumer
    container_name: food_waste_telemetry_consumer
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      KAFKA_TOPIC: telemetry.raw
      KAFKA_GROUP: telemetry-backend
      BACKEND_URL: http://backend:8000
    depends_on:
      kafka:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  sensor-simulator:
    build:
      context: ./sensor_simulator
    container_name: food_waste_sensor_simulator
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      MQTT_TOPIC_BASE: food/telemetry
      INTERVAL_SECONDS: 10
    depends_on:
      mqtt:
        condition: service_started
    restart: unless-stopped

volumes:
  timescaledb_data:
  kafka_data:
