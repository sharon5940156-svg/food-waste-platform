apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: timescaledb-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: timescaledb-init
data:
  init.sql: |
    CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;

    CREATE TABLE IF NOT EXISTS products (
        id SERIAL PRIMARY KEY,
        name VARCHAR(255) NOT NULL,
        base_shelf_life_days INTEGER NOT NULL,
        optimal_temp_c DOUBLE PRECISION NOT NULL
    );

    CREATE TABLE IF NOT EXISTS batches (
        id SERIAL PRIMARY KEY,
        product_id INTEGER NOT NULL
            REFERENCES products(id)
            ON DELETE CASCADE,
        quantity_kg DOUBLE PRECISION NOT NULL,
        production_date DATE NOT NULL,
        expiry_date DATE NOT NULL,
        current_status VARCHAR(50) NOT NULL
    );

    CREATE TABLE IF NOT EXISTS telemetry (
        time TIMESTAMPTZ NOT NULL,
        batch_id INTEGER NOT NULL
            REFERENCES batches(id)
            ON DELETE CASCADE,
        temperature_c DOUBLE PRECISION,
        humidity DOUBLE PRECISION,
        spoilage_risk_score DOUBLE PRECISION,
        PRIMARY KEY (time, batch_id)
    );

    CREATE TABLE IF NOT EXISTS daily_demand (
        id SERIAL PRIMARY KEY,
        product_id INTEGER NOT NULL
            REFERENCES products(id)
            ON DELETE CASCADE,
        date DATE NOT NULL,
        units_sold DOUBLE PRECISION NOT NULL,
        UNIQUE (product_id, date)
    );

    CREATE INDEX IF NOT EXISTS idx_batches_product_id
        ON batches(product_id);

    CREATE INDEX IF NOT EXISTS idx_batches_expiry_date
        ON batches(expiry_date);

    CREATE INDEX IF NOT EXISTS idx_batches_status
        ON batches(current_status);

    CREATE INDEX IF NOT EXISTS idx_telemetry_batch_time
        ON telemetry(batch_id, time DESC);

    CREATE INDEX IF NOT EXISTS idx_daily_demand_product_date
        ON daily_demand(product_id, date DESC);

    SELECT create_hypertable(
        'telemetry',
        'time',
        if_not_exists => TRUE
    );

    INSERT INTO products (
        name,
        base_shelf_life_days,
        optimal_temp_c
    )
    VALUES
        ('Milk', 10, 4.0),
        ('Fresh Berries', 5, 2.0),
        ('Raw Poultry', 3, 1.0);

    INSERT INTO batches (
        product_id,
        quantity_kg,
        production_date,
        expiry_date,
        current_status
    )
    VALUES
        (
            1,
            250.0,
            CURRENT_DATE - INTERVAL '2 days',
            CURRENT_DATE + INTERVAL '8 days',
            'in_storage'
        ),
        (
            2,
            80.5,
            CURRENT_DATE - INTERVAL '1 day',
            CURRENT_DATE + INTERVAL '4 days',
            'in_transit'
        ),
        (
            3,
            120.0,
            CURRENT_DATE,
            CURRENT_DATE + INTERVAL '3 days',
            'in_storage'
        );

---
apiVersion: v1
kind: Service
metadata:
  name: timescaledb
spec:
  selector:
    app: timescaledb
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timescaledb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: timescaledb
  template:
    metadata:
      labels:
        app: timescaledb
    spec:
      containers:
        - name: timescaledb
          image: timescale/timescaledb:latest-pg16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: food_waste_db
          volumeMounts:
            - name: database-storage
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
      volumes:
        - name: database-storage
          persistentVolumeClaim:
            claimName: timescaledb-pvc
        - name: init-script
          configMap:
            name: timescaledb-init